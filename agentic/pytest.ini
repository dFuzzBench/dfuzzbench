[pytest]
testpaths = tests
norecursedirs = data .* __pycache__
asyncio_default_fixture_loop_scope = function
# FORCE_DOCKER_TERMINAL=False lets the grep and bash tools run on the local terminal in tests.
# BASH_SILENCE_DEPRECATION_WARNING=1 suppresses deprecation warnings in MacOS (zsh default).
env =
    FORCE_DOCKER_TERMINAL=False
    BASH_SILENCE_DEPRECATION_WARNING=1
